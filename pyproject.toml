[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-delivery-core"
version = "0.1.0"
description = "Immutable request binding and durable single-use authorization primitives"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
github = ["requests>=2.32.5,<3"]
oidc = ["requests>=2.32.5,<3", "PyJWT[crypto]>=2.13,<3", "cryptography>=46,<51"]

[tool.setuptools.packages.find]
where = ["src"]
